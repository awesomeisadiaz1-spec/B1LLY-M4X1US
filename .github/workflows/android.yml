name: Build B1LLY APK
on:
  push:
    branches: [ccr-105b0940-7ikkaw, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: B1LLY-M4X1US-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk B1LLY-M4X1US.apk
          gh release delete billy-latest --cleanup-tag -y || true
          gh release create billy-latest B1LLY-M4X1US.apk --prerelease \
            --target "${{ github.sha }}" --title "B1LLY APK (latest build)" \
            --notes "Download B1LLY-M4X1US.apk and install it on your phone."
